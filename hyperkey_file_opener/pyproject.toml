[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperkey-file-opener"
version = "0.1.0"
description = "Flet service used by Hyperkey to open local files through Android FileProvider-backed intents."
requires-python = ">=3.10"
dependencies = ["flet>=0.80.0"]

[tool.flet.extensions.hyperkey_file_opener]
path = "flutter/hyperkey_file_opener"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flutter.hyperkey_file_opener" = ["**/*"]
