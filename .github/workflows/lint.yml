name: Linting and Code Quality

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort

    - name: Run Black code formatter check
      run: |
        black --check scripts/ tests/ --diff || true

    - name: Run isort import sorting check
      run: |
        isort --check-only scripts/ tests/ --diff || true

    - name: Run Flake8 linter
      run: |
        flake8 scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Run Pylint
      run: |
        pylint scripts/ --disable=all --enable=E,F --exit-zero || true
